services:
  - type: web
    name: rocketmail-django
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: bash -c 'if [ "$RUN_MIGRATIONS" = "1" ]; then python manage.py migrate --noinput; fi; gunicorn config.wsgi:application --bind 0.0.0.0:$PORT'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHON_ENV
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: RUN_MIGRATIONS
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://rocket-mail-site.vercel.app,http://localhost:8081,http://localhost:3000"
      - key: ALLOWED_ORIGIN_REGEX
        value: "https://([\\w-]+\\.)*vercel\\.app"
      - key: CLOUDINARY_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rocketmail-django-db
          property: connectionString

databases:
  - name: rocketmail-django-db
    plan: free
    region: oregon
